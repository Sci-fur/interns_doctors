<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Intern Duty Roster – Rangamati Medical College Hospital. Outdoor, Indoor and Emergency duty rosters, profiles, fairness and admin tools.">
<meta name="theme-color" content="#1A237E">
<title>Intern Duty Roster – Rangamati Medical College Hospital</title>
<link rel="icon" type="image/png" href="public/rangamati_medical_logo.png">
<link rel="apple-touch-icon" href="public/rangamati_medical_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand palette – derived from the Rangamati Medical College logo */
  --blue:#1A237E;
  --blue-deep:#121858;
  --blue-soft:#283593;
  --green:#2E7D32;
  --green-dark:#1B5E20;
  --red:#D32F2F;
  --red-dark:#C62828;
  --ink:#212121;
  --muted:#5F6878;
  --tint-blue:#E8EAF6;
  --tint-green:#E8F5E9;
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --line:#DDE2EE;
  --line-strong:#C8D0E2;
  --radius:14px;
  --shadow:0 1px 2px rgba(18,24,88,.05),0 14px 34px -24px rgba(18,24,88,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font:14px/1.55 Inter,"Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1100px 400px at 8% -10%,rgba(232,234,246,.85),transparent 65%),
    radial-gradient(900px 380px at 100% 0%,rgba(232,245,233,.75),transparent 60%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(46,125,50,.2)}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Header ─────────────────────────────────────────────── */
header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  padding:14px clamp(14px,3vw,30px);
  background:rgba(255,255,255,.94);
  border-top:4px solid var(--red);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 16px -12px rgba(18,24,88,.45);
  backdrop-filter:saturate(120%) blur(8px);
}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:260px}
.brand .logo{
  width:54px;height:54px;object-fit:contain;flex:0 0 auto;
  padding:3px;background:#fff;border-radius:13px;
  border:1px solid var(--line);
  box-shadow:0 4px 14px -8px rgba(26,35,126,.5);
}
.brand h1{
  margin:0;font-size:clamp(16px,2.2vw,21px);line-height:1.2;
  font-weight:800;letter-spacing:-.015em;color:var(--blue);
}
.brand .brand-sub{
  margin:2px 0 0;font-size:12px;font-weight:600;letter-spacing:.02em;
  color:var(--muted);display:flex;align-items:center;gap:6px;
}
.brand .brand-sub::before{
  content:"";width:7px;height:7px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),#66BB6A);flex:0 0 auto;
}
#mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}

/* ── Navigation ─────────────────────────────────────────── */
nav{
  flex:0 0 auto;
  display:flex;gap:6px;align-items:center;
  padding:9px clamp(14px,3vw,30px);
  background:rgba(255,255,255,.9);
  border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;
}
nav::-webkit-scrollbar{height:5px}
nav::-webkit-scrollbar-thumb{background:#c9d1e4;border-radius:4px}
nav button{
  flex:0 0 auto;
  border:0;background:transparent;color:var(--blue);
  padding:8px 14px;border-radius:9px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:600;line-height:1.2;
  white-space:nowrap;transition:background .16s,color .16s,box-shadow .16s,transform .16s;
}
nav button:hover{background:var(--tint-green);color:var(--green-dark)}
nav button:focus-visible{outline:3px solid rgba(46,125,50,.35);outline-offset:1px}
nav button.on{
  background:linear-gradient(135deg,var(--blue) 10%,var(--blue-soft) 48%,var(--green) 100%);
  color:#fff;
  box-shadow:0 6px 16px -8px rgba(26,35,126,.75);
}
nav button.on:hover{color:#fff}

/* ── Buttons ────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line-strong);background:#fff;color:var(--blue);
  padding:8px 14px;border-radius:9px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;
  transition:background .16s,border-color .16s,color .16s,box-shadow .16s,transform .16s;
}
.btn:hover{
  background:var(--tint-blue);border-color:#AEB9DC;color:var(--blue-deep);
  transform:translateY(-1px);box-shadow:0 6px 16px -12px rgba(18,24,88,.55);
}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:focus-visible{outline:3px solid rgba(26,35,126,.25);outline-offset:2px}
.btn.pri{
  background:linear-gradient(135deg,#35873A,var(--green) 55%,#276B2B);
  border-color:var(--green);color:#fff;
  box-shadow:0 5px 14px -8px rgba(46,125,50,.85);
}
.btn.pri:hover{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  border-color:var(--green-dark);color:#fff;
}
.btn.danger{color:var(--red);border-color:#E7A3A3;background:#fff}
.btn.danger:hover{background:linear-gradient(135deg,var(--red),var(--red-dark));border-color:var(--red-dark);color:#fff}
.btn.admin-on{
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  border-color:var(--red);color:#fff;box-shadow:0 5px 14px -8px rgba(211,47,47,.9);
}
.btn.admin-on:hover{background:linear-gradient(135deg,var(--red-dark),#A31F1F);border-color:#A31F1F;color:#fff}
#mode .btn[data-act="tour"]{border-color:var(--green);color:var(--green-dark)}
#mode .btn[data-act="tour"]:hover{background:var(--tint-green);border-color:var(--green);color:var(--green-dark)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Layout ─────────────────────────────────────────────── */
main{
  flex:1 0 auto;
  width:100%;max-width:1240px;
  margin:0 auto;
  padding:26px clamp(14px,3vw,30px) 44px;
}
.page-head{margin:0 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head h2{
  margin:0;font-size:clamp(19px,2.4vw,24px);line-height:1.2;
  color:var(--blue);font-weight:800;letter-spacing:-.02em;
}
.page-head p{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:70ch}
.page-head::after{
  content:"";flex:1 1 100%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--blue),var(--green) 55%,transparent 85%);
  opacity:.22;margin-top:10px;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}
.card h3{
  margin:0 0 12px;font-size:16px;line-height:1.3;
  color:var(--blue);font-weight:700;letter-spacing:-.01em;
}
.empty-state{
  padding:48px 22px;text-align:center;
  background:linear-gradient(180deg,#fff 0%,#FBFCFE 100%);
}
.empty-logo{
  width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 12px;
  padding:4px;background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 10px 24px -16px rgba(26,35,126,.7);
}
.empty-state p{max-width:54ch;margin:0 auto 6px;color:var(--muted);font-size:13px}
.empty-state p.mut{font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.row:last-child{margin-bottom:0}
label{
  display:flex;flex-direction:column;gap:4px;
  font-size:12px;font-weight:600;letter-spacing:.01em;color:#4B5468;
}
input,select,textarea{
  font:inherit;font-size:13.5px;color:var(--ink);
  padding:7px 10px;border:1px solid #D5DBEA;border-radius:8px;
  background:#fff;min-width:0;max-width:100%;
  transition:border-color .16s,box-shadow .16s;
}
input:hover,select:hover,textarea:hover{border-color:#B9C3DB}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(26,35,126,.13);
}
input[type="checkbox"]{
  width:17px;height:17px;padding:0;accent-color:var(--green);
  border:1px solid #B9C3DB;border-radius:4px;cursor:pointer;
}
input[type="number"]{min-width:70px}
input[type="date"]{min-width:140px}

/* ── Tables ─────────────────────────────────────────────── */
.scroll{
  overflow-x:auto;overflow-y:hidden;
  border-radius:10px;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.scroll::-webkit-scrollbar{height:8px}
.scroll::-webkit-scrollbar-thumb{background:#CBD3E4;border-radius:6px}
table{
  border-collapse:separate;border-spacing:0;width:100%;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:8px 11px;text-align:left;vertical-align:top;
}
th{
  background:var(--tint-blue);color:var(--blue);
  font-size:11.5px;font-weight:700;letter-spacing:.045em;
  text-transform:uppercase;white-space:nowrap;
}
td{font-size:13.5px}
tbody tr:nth-child(even) td{background:#FAFBFF}
tbody tr:hover td{background:#F2F6FF}
tbody tr:last-child td{border-bottom:0}
td input,td select{width:100%}
td a{font-weight:600}

/* ── Alerts & small text ────────────────────────────────── */
.warn,.err,.ok{
  padding:10px 13px;margin:8px 0;border-radius:9px;
  font-size:13px;line-height:1.5;border:1px solid;border-left-width:4px;
}
.warn{background:#FFF8E1;border-color:#F1D48E;border-left-color:#B7791F;color:#7A4F00}
.err{background:#FDECEE;border-color:#F2B8BE;border-left-color:var(--red);color:#8C1632}
.ok{background:var(--tint-green);border-color:#A9DBB0;border-left-color:var(--green);color:var(--green-dark)}
.mut{color:var(--muted);font-size:12px}
.b6{
  display:inline-block;font-size:10px;font-weight:700;line-height:1.5;
  background:var(--tint-green);color:var(--green-dark);
  border:1px solid #B7DDBB;border-radius:999px;
  padding:0 6px;margin-left:5px;vertical-align:1px;
}

/* ── Roster sheet ───────────────────────────────────────── */
.sheet{
  position:relative;overflow:hidden;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 26px 22px;margin-bottom:16px;box-shadow:var(--shadow);
}
.sheet::before{
  content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:linear-gradient(90deg,var(--blue) 0%,var(--blue-soft) 38%,var(--green) 72%,var(--red) 100%);
}
.sheet-h{text-align:center;margin-bottom:16px}
.sheet-logo{height:58px;width:auto;max-width:100%;object-fit:contain;margin:0 auto 6px;display:block}
.hosp{
  font-weight:800;font-size:clamp(16px,2.4vw,21px);line-height:1.25;
  letter-spacing:.045em;color:var(--blue);
}
.dept{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.ttl{
  display:inline-block;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-soft) 55%,var(--green-dark) 100%);
  color:#fff;padding:7px 22px;border-radius:999px;margin:10px 0;
  font-weight:700;font-size:13px;line-height:1.3;letter-spacing:.02em;
  box-shadow:0 8px 18px -12px rgba(26,35,126,.9);
}
.per{font-size:12px;color:var(--muted);line-height:1.7}
.sheet table{border-radius:8px}
.sheet th{background:var(--tint-blue)}
.sheet tr.fri td{background:#FFF2F3}
.sheet tbody tr:hover td{background:#F7F9FF}
.sheet tr.fri td:hover{background:#FFECEE}
.sheet .holiday{color:var(--red);font-style:italic;font-weight:600}
.sheet td div{white-space:nowrap}
.sigs{display:flex;justify-content:space-between;margin-top:56px;gap:24px}
.sigs div{
  flex:1;border-top:1px solid #3A3F4B;text-align:center;
  font-size:11px;line-height:1.45;padding-top:6px;color:#333;
}

/* ── Footer ─────────────────────────────────────────────── */
.site-footer{
  flex:0 0 auto;position:relative;
  background:linear-gradient(135deg,var(--blue-deep),var(--blue) 60%,#202B7A);
  color:#E8EAF6;
}
.site-footer::before{
  content:"";display:block;height:4px;
  background:linear-gradient(90deg,var(--red),var(--red-dark) 40%,#8E1D1D);
}
.footer-inner{
  max-width:1240px;margin:0 auto;
  padding:20px clamp(14px,3vw,30px);
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:12.5px;
}
.footer-brand{display:flex;align-items:center;gap:10px;font-weight:600;color:#fff}
.footer-brand img{width:32px;height:32px;object-fit:contain;padding:2px;background:#fff;border-radius:7px}
.footer-note{color:#C5CAE9;line-height:1.5}
.footer-note b{color:#fff;font-weight:600}

/* ── Guided tour ────────────────────────────────────────── */
#tour .tour-catch{position:fixed;inset:0;z-index:1000}
#tour.nohl .tour-catch{background:rgba(10,16,40,.62)}
#tour .tour-hl{
  position:fixed;z-index:1001;border-radius:10px;
  box-shadow:0 0 0 9999px rgba(10,16,40,.62);
  outline:3px solid #4CAF50;
  box-shadow:0 0 0 9999px rgba(10,16,40,.62),0 0 0 7px rgba(76,175,80,.22);
  pointer-events:none;display:none;
}
#tour .tour-box{
  position:fixed;left:50%;transform:translateX(-50%);
  width:min(560px,calc(100vw - 24px));z-index:1002;
  background:#fff;border-radius:14px;border-top:4px solid var(--green);
  padding:16px 18px;
  box-shadow:0 24px 60px -12px rgba(10,16,40,.55),0 0 0 1px rgba(18,24,88,.08);
}
#tour .tour-box.bot{bottom:14px}
#tour .tour-box.top{top:14px}
#tour .tour-box.mid{top:50%;transform:translate(-50%,-50%)}
#tour h3{margin:3px 0 8px;font-size:17px;line-height:1.3;color:var(--blue);font-weight:800}
#tour .tour-n{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--green-dark);
}
#tour .tour-t{font-size:13.5px;line-height:1.7;color:#333}
#tour .tour-b{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
#tour button:disabled{opacity:.4;cursor:default}

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width:720px){
  header{padding-top:11px;padding-bottom:11px;gap:10px}
  .brand{min-width:0;gap:11px}
  .brand .logo{width:46px;height:46px;border-radius:11px}
  .brand h1{font-size:16px}
  .brand .brand-sub{font-size:11px}
  #mode{width:100%;justify-content:flex-end;margin-left:0}
  main{padding-top:18px}
  .card{padding:14px}
  .sheet{padding:20px 14px 18px}
  .sigs{gap:12px;margin-top:42px}
  .sigs div{font-size:10px}
  nav{padding-top:7px;padding-bottom:7px}
  .page-head h2{font-size:19px}
  .row{gap:10px}
  label{flex:1 1 140px}
  label input,label select{width:100%}
}
@media (max-width:430px){
  .brand .brand-sub{display:none}
  #mode{justify-content:flex-start}
  th,td{padding:7px 8px}
  .sheet .dept{font-size:11px}
  .sheet .per{font-size:11px}
}

/* ── Print: only the roster sheet ───────────────────────── */
@media print{
  /* 1. Hide everything except the printable roster */
  body > header,
  body > nav,
  body > footer,
  #tour,
  .noprint,
  main > *:not(#roster-output){display:none!important}

  /* 2. Remove the screen shell so the sheet fills the whole page */
  html,body{
    display:block!important;min-height:0!important;
    margin:0!important;padding:0!important;background:#fff!important;
  }
  main{
    display:block!important;width:100%!important;max-width:none!important;
    margin:0!important;padding:0!important;
  }

  /* 3. The printable area */
  #roster-output{
    display:block!important;width:100%!important;max-width:none!important;
    margin:0!important;padding:0!important;
    border:0!important;border-radius:0!important;box-shadow:none!important;
    overflow:visible!important;background:#fff!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
  #roster-output *{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }

  /* 4. Clean paper layout + keep brand colours/row stripes */
  #roster-output::before{display:none!important}
  #roster-output .scroll{overflow:visible!important;border-radius:0!important}
  #roster-output table{
    width:100%!important;border-radius:0!important;
    border-color:#9AA3B8!important;table-layout:auto!important;
  }
  #roster-output th,
  #roster-output td{border-color:#9AA3B8!important;padding:5px 7px!important}
  #roster-output th{background:var(--tint-blue)!important;color:var(--blue)!important}
  #roster-output tr.fri td{background:#FFF2F3!important}
  #roster-output td div{white-space:normal!important}
  #roster-output thead{display:table-header-group}
  #roster-output tr{page-break-inside:avoid;break-inside:avoid}
  .sigs{page-break-inside:avoid;break-inside:avoid}

  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" src="public/rangamati_medical_logo.png" alt="Rangamati Medical College logo">
    <div>
      <h1>Intern Duty Roster</h1>
      <p class="brand-sub">Rangamati Medical College Hospital</p>
    </div>
  </div>
  <span id="mode"></span>
</header>
<nav id="nav" aria-label="Main navigation"></nav>
<main id="app">Loading…</main>
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="public/rangamati_medical_logo.png" alt="">
      <span>Rangamati Medical College Hospital</span>
    </div>
    <div class="footer-note"><b>Intern Duty Roster</b> · Outdoor · Indoor · Emergency</div>
  </div>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
